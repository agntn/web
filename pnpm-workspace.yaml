allowBuilds:
  "@google/genai": false
  esbuild: true
  koffi: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - "@agntn/ox@0.1.0"
  - "@earendil-works/chord@0.86.1"
  - "@earendil-works/pi-agent-core@0.86.1"
  - "@earendil-works/pi-ai@0.86.1"
  - "@earendil-works/pi-coding-agent@0.86.1"
  - "@earendil-works/pi-telemetry@0.86.1"
  - "@earendil-works/pi-tui@0.86.1"

packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
